<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronCore Fitness | Achieve Your Ultimate Physique</title>
    <meta name="description"
        content="Structured fitness programs and personal training for busy professionals seeking fast, visible results.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>\n<body style="margin:0; overflow:hidden;">\n
    <section style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.9)), url('https://images.unsplash.com/photo-1534438327276-14e5300c3a48?q=80&w=2070&auto=format&fit=crop') center/cover no-repeat;">
        <div class="modal-content fade-in visible" style="position: static; transform: none; box-shadow: 0 20px 50px rgba(0,0,0,0.8);">
            <div style="text-align: center; margin-bottom: 30px;">
                <a href="index.html" class="logo" style="font-size: 2.5rem;">Iron<span>Core</span></a>
            </div>
            <h2 class="modal-title" style="font-size: 1.8rem;">Member Login</h2>
            <p class="modal-subtitle">Access your custom plans and track progress.</p>
            
            <form class="ajax-form">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" required>
                </div>
                <div style="display: flex; justify-content: space-between; margin-bottom: 20px; font-size: 0.9rem;">
                    <label style="color: var(--gray);"><input type="checkbox" style="margin-right: 5px;"> Remember me</label>
                    <a href="#" style="color: var(--primary-red);">Forgot Password?</a>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
                <div style="text-align: center; margin-top: 20px; color: var(--gray);">
                    Not a member yet? <a href="index.html#pricing" style="color: var(--white); text-decoration: underline;">View Plans</a>
                </div>
            </form>
            <!-- Include script for generic form submission logic -->
            <script src="script.js"></script>
        </div>
    </section>
    \n</body>\n</html>
